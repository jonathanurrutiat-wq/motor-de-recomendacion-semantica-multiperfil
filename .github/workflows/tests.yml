name: Tests

# Pruebas unitarias con datos sintéticos (sin modelos de embeddings ni reseñas)
# y revisión estática del código con pyflakes.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de las pruebas
        run: pip install numpy pandas scipy scikit-learn pytest pyflakes

      - name: Revisión estática (pyflakes)
        run: python -m pyflakes src tests

      - name: Pruebas unitarias
        run: python -m pytest -q tests
